# Vanilla Finest Helper: the mod versions the Folders module was made and tested for (Minecraft 26.3).
# A folder is only handled with its mod in one of these versions; with another version it stays off
# and the log says so. Compared with the number part of the mod's version ("0.43.6" for
# "0.43.6-for-MC26.3"); "6.1.*" accepts any 6.1.x.
# Folders module: Flashback's replay folder (redirects Flashback.getReplayFolder; off with Flashback Settings)
flashback=0.43.6
# Folders module: Axiom's blueprint folder (writes Axiom's own "blueprint.customPath" setting by name)
axiom=6.1.*
# Shader Folder tooltips: Iris Shader Folder's tooltip texts in the game's language (TooltipRule.getTooltipText)
iris_shader_folder=1.4.*
