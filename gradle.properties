org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

loom_version=1.16-SNAPSHOT

mod_version=1.0.0
maven_group=io.github.hiveko
archives_base_name=vanilla-finest-helper

# One jar per Minecraft version. The 26.x jars are built here with -Pmc=<version> (default below),
# using versions/<version>.properties; 1.21.11 and 1.21.1 have their own Gradle projects in
# mc1.21.11/ and mc1.21.1/ (obfuscated versions, built with Mojang mappings and remapped).
# Sources: src/main/java (all versions), platform/mc26/java (all 26.x), platform/mc<version>/.
mc_default=26.3
