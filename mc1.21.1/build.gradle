plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

// Same shared sources as the 26.x builds, plus platform/mc1.21.1/.
def root = file('..')
def rootProps = new Properties()
new File(root, 'gradle.properties').withInputStream { rootProps.load(it) }

version = "${rootProps.mod_version}+mc1.21.1"
group = rootProps.maven_group

base {
    archivesName = rootProps.archives_base_name
}

sourceSets.main {
    java.srcDirs = [new File(root, 'src/main/java'), layout.buildDirectory.dir('generated/mc26-for-1.21.1').get().asFile,
                    new File(root, 'platform/mc1.21.1/java')]
    resources.srcDirs = [new File(root, 'src/main/resources'), new File(root, 'platform/mc1.21.1/resources')]
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

// The setup screen and GUI scale module are written once for 26.x (platform/mc26/java) and copied here with
// these renames: the 1.21.11 ones (Minecraft 26.1 renamed GuiGraphics to GuiGraphicsExtractor and its render
// methods to extract..., Fabric API renamed Screens.getButtons to getWidgets), Identifier back to
// ResourceLocation, and the mouse methods with x, y and button instead of 1.21.9's MouseButtonEvent (a
// record of the same name in platform/mc1.21.1/java stands in for it). Drawing, tooltips, the folder picker
// and the other differences are in platform/mc1.21.1/java (Compat).
def mc26Renames = [
    'logo.extractRenderState('       : 'logo.renderLogo(',
    'super.extractRenderState('      : 'super.render(',
    'public void extractRenderState(': 'public void render(',
    'extractMenuBackground('         : 'renderMenuBackground(',
    'GuiGraphicsExtractor'           : 'GuiGraphics',
    'g.text('                        : 'g.drawString(',
    'g.centeredText('                : 'g.drawCenteredString(',
    'g.outline('                     : 'g.renderOutline(',
    'Screens.getWidgets('            : 'Screens.getButtons(',
    'resizeGui'                      : 'resizeDisplay',
    'import net.minecraft.resources.Identifier;'          : 'import net.minecraft.resources.ResourceLocation;',
    'net.minecraft.resources.Identifier'                  : 'net.minecraft.resources.ResourceLocation',
    'Identifier'                                          : 'ResourceLocation',
    'import net.minecraft.client.input.MouseButtonEvent;' : '',
    'public boolean mouseClicked(MouseButtonEvent event, boolean doubleClick) {':
        'public boolean mouseClicked(double eventX, double eventY, int eventButton) { MouseButtonEvent event = new MouseButtonEvent(eventX, eventY, eventButton); boolean doubleClick = false;',
    'super.mouseClicked(event, doubleClick)'               : 'super.mouseClicked(event.x(), event.y(), event.button())',
    'public boolean mouseDragged(MouseButtonEvent event, double dx, double dy) {':
        'public boolean mouseDragged(double eventX, double eventY, int eventButton, double dx, double dy) { MouseButtonEvent event = new MouseButtonEvent(eventX, eventY, eventButton);',
    'super.mouseDragged(event, dx, dy)'                    : 'super.mouseDragged(event.x(), event.y(), event.button(), dx, dy)',
    'public boolean mouseReleased(MouseButtonEvent event) {':
        'public boolean mouseReleased(double eventX, double eventY, int eventButton) { MouseButtonEvent event = new MouseButtonEvent(eventX, eventY, eventButton);',
    'super.mouseReleased(event)'                           : 'super.mouseReleased(event.x(), event.y(), event.button())',
    'public void onClick(MouseButtonEvent event, boolean doubleClick) {':
        'public void onClick(double eventX, double eventY) { MouseButtonEvent event = new MouseButtonEvent(eventX, eventY, 0); boolean doubleClick = false;',
    'super.onClick(event, doubleClick)'                    : 'super.onClick(event.x(), event.y())',
    'public void onRelease(MouseButtonEvent event) {':
        'public void onRelease(double eventX, double eventY) { MouseButtonEvent event = new MouseButtonEvent(eventX, eventY, 0);',
    'super.onRelease(event)'                               : 'super.onRelease(event.x(), event.y())',
]
def mc26Sources = tasks.register('mc26Sources', Copy) {
    from(new File(root, 'platform/mc26/java'))
    into(layout.buildDirectory.dir('generated/mc26-for-1.21.1'))
    inputs.property('renames', mc26Renames.toString())
    filter { String line -> mc26Renames.inject(line) { l, e -> l.replace(e.key, e.value) } }
}
tasks.named('compileJava') { dependsOn mc26Sources }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Mod Menu's API for the setup screen's Configure button (Mod Menu 11.0.5, Modrinth version 6lgOkclV; not bundled)
    modCompileOnly "maven.modrinth:modmenu:6lgOkclV"
}

processResources {
    def props = [version: project.version, minecraft_range: project.minecraft_range,
                 loader_min: project.loader_min, java_version: '21',
                 client_extra: ', "io.github.hiveko.vanillafinest.helper.setup.SetupModule"',
                 entrypoints_extra: ',\n    "modmenu": ["io.github.hiveko.vanillafinest.helper.setup.ModMenuEntry"]']
    inputs.properties props
    filesMatching("fabric.mod.json") { expand props }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 21
}

jar {
    from(new File(root, 'LICENSE')) {
        rename { "${it}_${rootProps.archives_base_name}" }
    }
}
