plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

def mc = (findProperty('mc') ?: project.mc_default).toString()
def v = new Properties()
file("versions/${mc}.properties").withInputStream { v.load(it) }

version = "${project.mod_version}+mc${mc}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

sourceSets.main {
    java.srcDirs += ["platform/mc${mc}/java"]
    resources.srcDirs += ["platform/mc${mc}/resources"]
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${v.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${v.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${v.fabric_version}"
    // Flashback and Axiom are not needed at compile time: Flashback is targeted by name, Axiom's settings
    // file is written as JSON and its running setting is reached by reflection. The setup screen reaches
    // the other mods by reflection too; only Mod Menu's API is needed to compile (modmenu= line, not bundled).
    if (v.modmenu) compileOnly(v.modmenu)
}

processResources {
    def props = [version: project.version, minecraft_range: v.minecraft_range,
                 loader_min: v.loader_min, java_version: '25',
                 client_extra: v.client_extra ?: '', entrypoints_extra: v.entrypoints_extra ?: '']
    inputs.properties props
    filesMatching("fabric.mod.json") { expand props }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    if (JavaVersion.current() < JavaVersion.toVersion(25)) {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
