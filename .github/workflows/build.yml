# Builds every jar (one per Minecraft version) and uploads them as one artifact.
name: Build

# Started by hand only (Actions -> Run workflow): no builds on push or pull requests.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ['26.3', '26.2', '26.1.2', '1.21.11', '1.21.1']
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 21 and 25
        uses: actions/setup-java@v4
        with:
          java-version: |
            21
            25
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build for Minecraft ${{ matrix.target }}
        run: |
          chmod +x ./gradlew
          case "${{ matrix.target }}" in
            1.21.*) ./gradlew -p mc${{ matrix.target }} build --stacktrace; dir=mc${{ matrix.target }}/build/libs ;;
            *)      ./gradlew build -Pmc=${{ matrix.target }} --stacktrace; dir=build/libs ;;
          esac
          mkdir -p dist
          cp $dir/*+mc${{ matrix.target }}.jar dist/
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.target }}
          path: dist/*.jar
          retention-days: 14

  collect:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: vanilla-finest-helper
          path: dist/*.jar
          retention-days: 14
